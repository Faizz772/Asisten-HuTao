<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Hutao</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Particle Background -->
  <div id="particles"></div>

  <div id="app">
    <!-- Header dengan Avatar Gambar Hutao (URL dari kamu) -->
    <div id="header">
      <div class="avatar-container">
        <img 
          src="https://i.ibb.co.com/MxW2gxTh/Picture1.jpg" 
          alt="Hutao"
          class="avatar-img"
          onerror="this.src='🌸'; this.style.fontSize='40px'; this.style.display='flex'; this.style.alignItems='center'; this.style.justifyContent='center';"
        >
        <div class="status-dot"></div>
      </div>
      <div class="header-text">
        <h1>Asisten Hutao</h1>
        <p>✨ AI centil siap bantu tugasmu!</p>
      </div>
    </div>

    <!-- Chat Box -->
    <div id="chat-box"></div>

    <!-- Input Area - PASTI MUNCUL -->
    <div id="input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan ke Hutao...">
      <button id="send-btn">
        <span>Kirim</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
