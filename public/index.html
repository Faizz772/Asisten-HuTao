<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Hutao</title>
  <!-- Google Font untuk gaya yang lebih playful -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Dekorasi bunga di pojok -->
    <div class="flower flower-left">🌸</div>
    <div class="flower flower-right">🌸</div>

    <div id="header">
      <h1>🍡 Asisten Hutao</h1>
      <p>AI centil siap bantu tugasmu!</p>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
      <input type="text" id="user-input" placeholder="Tanya apa aja ke Hutao...">
      <button id="send-btn">Kirim</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
